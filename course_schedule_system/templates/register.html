{% extends "base.html" %}
{% block title %}注册 - 校科协智能课表管理{% endblock %}
{% block content %}
<div class="row justify-content-center mt-2">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-person-plus"></i> 注册新成员</h5>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">学号 <span class="text-danger">*</span></label>
              <input class="form-control" type="text" name="student_id" required
                     value="{{ form.student_id if form }}" placeholder="用于登录，需唯一">
            </div>
            <div class="col-md-6">
              <label class="form-label">真实姓名 <span class="text-danger">*</span></label>
              <input class="form-control" type="text" name="name" required
                     value="{{ form.name if form }}" placeholder="请输入真实姓名">
            </div>
            <div class="col-md-6">
              <label class="form-label">密码 <span class="text-danger">*</span></label>
              <input class="form-control" type="password" name="password" required minlength="6" placeholder="至少 6 位">
            </div>
            <div class="col-md-6">
              <label class="form-label">组织身份 <span class="text-danger">*</span></label>
              <select class="form-select" name="identity" id="identitySelect" required>
                <option value="">请选择身份</option>
                {% for it in IDENTITIES %}
                <option value="{{ it }}" {% if form and form.identity == it %}selected{% endif %}>{{ it }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">部门</label>
              <select class="form-select" name="department" id="departmentSelect" disabled>
                <option value="">— 选择部门 —</option>
                {% for d in departments %}
                <option value="{{ d }}" {% if form and form.department == d %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">届数</label>
              <input class="form-control" type="number" disabled
                     placeholder="注册时自动分配（{{ current_year }} 届）">
            </div>
          </div>
          <div class="mt-3 d-grid">
            <button class="btn btn-primary" type="submit">注 册</button>
          </div>
          <div class="mt-2 text-center">
            <span class="text-muted">已有账号？</span><a href="{{ url_for('login') }}">去登录</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
