{% extends "base.html" %}
{% block title %}修改密码 - 校科协智能课表管理{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="bi bi-key"></i> 修改密码</h5></div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">原密码</label>
            <input class="form-control" type="password" name="old_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">新密码</label>
            <input class="form-control" type="password" name="new_password" required minlength="6" placeholder="至少 6 位">
          </div>
          <div class="mb-3">
            <label class="form-label">确认新密码</label>
            <input class="form-control" type="password" name="confirm_password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">保存新密码</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
