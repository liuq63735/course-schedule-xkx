{% extends "base.html" %}
{% block title %}编辑用户 - 校科协智能课表管理{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-7">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-person-gear"></i> 编辑用户</h5>
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_users') }}"><i class="bi bi-arrow-left"></i> 返回</a>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">学号（只读）</label>
            <input class="form-control" value="{{ user.student_id }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">真实姓名</label>
            <input class="form-control" name="name" value="{{ user.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">专业</label>
            <input class="form-control" name="major" value="{{ user.major or '' }}" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label">性别</label>
              <select class="form-select" name="gender" required>
                <option value="男" {% if user.gender == '男' %}selected{% endif %}>男</option>
                <option value="女" {% if user.gender == '女' %}selected{% endif %}>女</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">手机号</label>
              <input class="form-control" name="phone" value="{{ user.phone or '' }}" pattern="1[0-9]{10}" required>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">身份</label>
              <select class="form-select" name="identity" id="identitySel">
                {% for it in IDENTITIES %}
                <option value="{{ it }}" {% if user.identity == it %}selected{% endif %}>{{ it }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">届数</label>
              <input class="form-control" type="number" name="cohort" value="{{ user.cohort }}" min="2000" required>
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">部门</label>
            <select class="form-select" name="department" id="departmentSel">
              <option value="">— 无（主席）—</option>
              {% for d in DEPARTMENTS %}
              <option value="{{ d }}" {% if user.department == d %}selected{% endif %}>{{ d }}</option>
              {% endfor %}
            </select>
            <div class="form-text">主席无需选择部门，保存时原部门将被自动清空。</div>
          </div>
          <button class="btn btn-primary" type="submit">保存修改</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
