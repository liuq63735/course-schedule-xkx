{% extends "base.html" %}
{% block title %}设置 - 校科协智能课表管理{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="bi bi-gear"></i> 个人设置</h5></div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">专业</label>
            <input class="form-control" type="text" name="major" value="{{ user.major or '' }}" required>
          </div>
          <hr>
          <p class="text-muted small">如需修改密码，请填写下面三项；只修改专业时可以留空。</p>
          <div class="mb-3">
            <label class="form-label">原密码</label>
            <input class="form-control" type="password" name="old_password">
          </div>
          <div class="mb-3">
            <label class="form-label">新密码</label>
            <input class="form-control" type="password" name="new_password" minlength="6" placeholder="至少 6 位">
          </div>
          <div class="mb-3">
            <label class="form-label">确认新密码</label>
            <input class="form-control" type="password" name="confirm_password">
          </div>
          <button class="btn btn-primary w-100" type="submit">保存设置</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
